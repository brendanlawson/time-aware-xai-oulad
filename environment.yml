# Verified 2026-07-12 against the committed model bundles (sklearn 1.8 / numpy 2.x pickles).
# Older pins (py3.11/sklearn1.5) could not load ann_*.joblib and crashed savefig/.fit on Windows.
#
# Conda environment for the project.
# Usage:
#   conda env create -f environment.yml
#   conda activate dsp
#
# This path installs the heavy binary packages from conda-forge (prebuilt,
# no compiler needed) and leaves only the pure-Python / XAI packages to pip.
name: dsp
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip

  # Core scientific stack (conda-forge binaries)
  - numpy=2.3.*
  - pandas=2.3.*
  - scipy=1.16.*
  - pyarrow=21.*

  # Machine learning
  - scikit-learn=1.8.0   # hard pin — committed .joblib bundles are sklearn 1.8 pickles
  - xgboost=3.1.*
  - lightgbm=4.6.*
  - imbalanced-learn=0.14.*

  # Visualisation
  - matplotlib=3.10.*
  - seaborn=0.13.*
  - missingno>=0.5

  # Experiment harness & notebooks
  - joblib>=1.4
  - jupyter>=1.0
  - nbformat>=5.9
  - pytest>=8.2

  # Tooling used by src/ (CLI, logging, progress, lint)
  - typer>=0.12
  - tqdm>=4.66
  - ruff>=0.5

  # Packages best installed via pip
  - pip:
      - shap==0.52.*
      - lime>=0.2,<0.3
      - streamlit>=1.35
      - loguru>=0.7
      - python-dotenv>=1.0
